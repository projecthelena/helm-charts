name: Build and Deploy Helm Charts

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: helm-charts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.22.0

      - name: Test Warden configuration
        run: |
          python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
          python3 .github/scripts/test_warden_chart.py

      - name: Test chart publishing
        run: python3 .github/scripts/test_package_charts.py

      - name: Update chart dependencies
        run: |
          set -euo pipefail
          for chart in charts/*; do
            helm dependency build "${chart}"
          done

      - name: Lint charts
        run: |
          set -euo pipefail
          for chart in charts/*; do
            echo "Linting ${chart}"
            helm lint "${chart}"
          done

      - name: Render charts
        run: |
          set -euo pipefail
          for chart in charts/*; do
            echo "Rendering ${chart}"
            helm template preview "${chart}" >/dev/null
          done

      - name: Package charts and preserve published versions
        run: python3 .github/scripts/package_charts.py

      - name: Add landing page assets
        run: |
          cp site/index.html dist/index.html
          cp site/styles.css dist/styles.css
          cp site/favicon.svg dist/favicon.svg
          cp artifacthub-repo.yml dist/artifacthub-repo.yml

      - name: Upload packaged charts artifact
        uses: actions/upload-artifact@v4
        with:
          name: helm-charts
          path: dist

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Download packaged charts artifact
        uses: actions/download-artifact@v4
        with:
          name: helm-charts
          path: dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
